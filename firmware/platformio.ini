; ---------------------------------------------------------------------------
; Firmware ESP32-CAM (AI-Thinker) : capture JPEG -> fragmentation -> UDP.
;
; Le protocole partagé (même en-tête / CRC que le récepteur PC) est VENDORISÉ
; dans src/cam/protocol.hpp + src/protocol.cpp : PlatformIO compile tout src/
; automatiquement. Ces deux fichiers sont des copies de common/ (protocole figé).
;
; VERSION DE PLATEFORME ÉPINGLÉE (espressif32@6.9.0) : certaines versions
; récentes livrent le framework SANS le variant qui contient pins_arduino.h
; -> "pins_arduino.h: No such file or directory" au build. 6.9.0 (arduino-esp32
; 2.0.17) est stable et éprouvée avec l'ESP32-CAM. Ne "mets pas à jour" ce champ
; sans raison.
;
; board esp32dev : ESP32 générique (variant "esp32" complet). Les broches caméra
; viennent de notre camera_pins.h, pas du variant.
;
; Flash :  pio run -t upload   (GPIO0 relié à GND pendant le flash, voir README)
; ---------------------------------------------------------------------------
[env:esp32cam]
platform  = espressif32@6.9.0
board     = esp32dev
framework = arduino
monitor_speed = 115200

; La caméra + le réseau prennent de la place : partition "huge_app".
board_build.partitions = huge_app.csv

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM      ; l'AI-Thinker a de la PSRAM (framebuffer camera)
