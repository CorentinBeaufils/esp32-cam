; ---------------------------------------------------------------------------
; ESP32-CAM firmware (AI-Thinker): JPEG capture -> fragmentation -> UDP.
;
; The shared protocol (same header / CRC as the PC receiver) is VENDORED in
; src/cam/protocol.hpp + src/protocol.cpp: PlatformIO compiles all of src/
; automatically. These two files are copies of common/ (frozen protocol).
;
; PINNED PLATFORM VERSION (espressif32@6.9.0): some recent versions ship the
; framework WITHOUT the variant that contains pins_arduino.h -> "pins_arduino.h:
; No such file or directory" at build time. 6.9.0 (arduino-esp32 2.0.17) is
; stable and proven with the ESP32-CAM. Do not "update" this field without
; reason.
;
; board esp32dev: generic ESP32 (full "esp32" variant). The camera pins come
; from our camera_pins.h, not from the variant.
;
; Flash:  pio run -t upload   (GPIO0 tied to GND during the flash, see README)
; ---------------------------------------------------------------------------
[env:esp32cam]
platform  = espressif32@6.9.0
board     = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts=0
monitor_dtr=0


; The camera + the network take up space: "huge_app" partition.
board_build.partitions = huge_app.csv

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM      ; the AI-Thinker has PSRAM (camera framebuffer)
